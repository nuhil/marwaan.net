<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#02040c">
  <title>Space Explorer | Marwaan's Wonder Lab</title><meta name="description" content="Explore planet layers, watch a solar eclipse, and fly staged rockets to the Moon and Mars.">
  <link rel="canonical" href="https://marwaan.net/space.html"><link rel="stylesheet" href="css/space.css?v=13">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body><main class="space-app">
  <div id="space-canvas" class="space-stage" aria-label="Interactive three-dimensional space explorer. Drag to turn and pinch or scroll to zoom."></div><div class="stage-shade"></div>
  <header class="space-brand glass-panel"><a href="index.html" class="brand-mark" aria-label="Back to Wonder Lab"><i data-icon="space"></i></a><a href="index.html" class="brand-copy"><b>SPACE EXPLORER</b><small>WONDER LAB</small></a></header>
  <nav class="viewer-tools glass-panel" aria-label="Space viewer tools"><button id="reset-view" aria-label="Show full solar system" title="Solar system view"><i data-icon="reset"></i></button><button id="auto-rotate" class="active" aria-label="Auto rotate" title="Auto rotate" aria-pressed="true"><i data-icon="rotate"></i></button><button id="toggle-labels" class="active" aria-label="Toggle planet labels" title="Planet labels" aria-pressed="true"><i data-icon="tag"></i></button><button id="music-toggle" class="audio-toggle" aria-label="Toggle music" aria-pressed="false"><i data-icon="music"></i><span>Music off</span></button></nav>
  <section class="planet-finder glass-panel" id="planet-finder" aria-labelledby="finder-title"><div class="finder-heading"><span><small>PLANET HOPPER</small><b id="finder-title">Pick a world</b></span><button id="close-finder" aria-label="Close planet picker"><i data-icon="close"></i></button></div><div class="planet-grid" id="planet-dock"></div></section>
  <button class="open-finder glass-panel" id="open-finder" aria-label="Choose a planet"><i data-icon="space"></i><span>Planets</span></button>
  <aside class="info-panel glass-panel" id="info-panel" aria-live="polite"><button id="close-info" class="panel-close" aria-label="Close information"><i data-icon="close"></i></button><p id="info-kicker">SOLAR SYSTEM</p><h1 id="info-title">Choose a planet</h1><p id="info-copy">Tap a world to fly close and look inside.</p><div class="planet-stats" id="planet-stats" hidden><div><small>YEAR</small><b id="planet-year">365 days</b></div><div><small>MOONS</small><b id="planet-moons">1</b></div><div><small>TEMP</small><b id="planet-temp">15°C</b></div></div><div class="layer-list" id="layer-list" hidden></div><div class="progress-wrap" id="mission-progress" hidden><span><b id="progress-label">LAUNCH</b><strong id="progress-value">0%</strong></span><i><em id="progress-bar"></em></i></div><button id="replay-simulation" class="replay" type="button" hidden><i data-icon="reset"></i><span>Play again</span></button></aside>
  <section class="mode-ribbon glass-panel" aria-label="Space activities"><div class="ribbon-title"><i data-icon="spark"></i><span><small>SPACE LAB</small><b>Choose an adventure</b></span></div><div class="mode-grid"><button class="mode-button active" data-mode="explore"><i data-icon="space"></i><span><b>Planets</b><small>Look inside</small></span></button><button class="mode-button" data-mode="eclipse"><i data-icon="eye"></i><span><b>Eclipse</b><small>Moon shadow</small></span></button><button class="mode-button" data-mode="moon"><i data-icon="launch"></i><span><b>Moon trip</b><small>3 stages</small></span></button><button class="mode-button" data-mode="mars"><i data-icon="launch"></i><span><b>Mars trip</b><small>Long flight</small></span></button></div></section>
  <div class="control-hint"><span><b>Drag</b> turn</span><span><b>Pinch</b> zoom</span><span><b>Tap</b> explore</span></div><div id="load-status" class="load-status"><span></span><b>Building the solar system…</b></div><div id="feedback" class="feedback" role="status"></div><div id="webgl-fallback" class="world-fallback" hidden><div><h1>3D needs WebGL</h1><p>Try a current browser.</p><a href="index.html">Go home</a></div></div>
</main><script type="module" src="js/space.js?v=13"></script></body>
</html>
