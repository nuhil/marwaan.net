<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Marwaan a Message | Contact Form ✉️</title>
  <meta name="description" content="Send a message to Marwaan! Parents can leave greetings or questions for LEGO builds.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="canonical" href="https://marwaan.net/contact.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>">
  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Marwaan's Lego World">
  <meta property="og:title" content="Send Marwaan a Message | Contact Form ✉️">
  <meta property="og:description" content="Send a message to Marwaan! Parents can leave greetings or questions for LEGO builds.">
  <meta property="og:url" content="https://marwaan.net/contact.html">
  <meta property="og:image" content="https://marwaan.net/images/headshot.JPG">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Send Marwaan a Message | Contact Form ✉️">
  <meta name="twitter:description" content="Send a message to Marwaan! Parents can leave greetings or questions for LEGO builds.">
  <meta name="twitter:image" content="https://marwaan.net/images/headshot.JPG">
</head>
<body>
  
  <div id="site-header"></div>

  <main>
    <section class="contact-container">
      
      <!-- Lego Postbox Card -->
      <div class="lego-card coral">
        
        <!-- Postbox Roof/Studs -->
        <div class="lego-studs-row">
          <span class="lego-stud"></span>
          <span class="lego-stud"></span>
          <span class="lego-stud"></span>
          <span class="lego-stud"></span>
        </div>
        
        <div class="postbox-header">
          <h2>Drop a Letter in My Postbox! 📮</h2>
        </div>
        
        <div class="lego-card-body" style="background-color: var(--white); color: var(--dark-gray);">
          <p style="font-size: 1.25rem; margin-bottom: 1.5rem; font-weight: 600; text-align: center;">
            Ask me about my Lego creations, or tell me about your favorite dinosaurs! My dad helps me read my mail.
          </p>
          
          <!-- Message Form targeting Formspree -->
          <form action="https://formspree.io/f/your-form-id" method="POST" id="postbox-form">
            
            <fieldset style="border: none;">
              <legend class="visually-hidden">Message Sender details</legend>
              
              <!-- Name Input -->
              <div class="form-group">
                <label for="sender-name">Your Name:</label>
                <input 
                  type="text" 
                  id="sender-name" 
                  name="name" 
                  class="form-control" 
                  required 
                  autocomplete="name" 
                  placeholder="e.g. Grandma or Billy"
                  maxlength="60"
                  aria-describedby="name-help"
                >
                <span id="name-help" style="font-size: 0.95rem; color: #666; font-weight: 600;">Please tell me your name!</span>
              </div>
              
              <!-- Email Input (Optional for reply) -->
              <div class="form-group">
                <label for="sender-email">Your Email (so we can reply!):</label>
                <input 
                  type="email" 
                  id="sender-email" 
                  name="email" 
                  class="form-control" 
                  autocomplete="email" 
                  placeholder="e.g. mail@example.com"
                  aria-describedby="email-help"
                >
                <span id="email-help" style="font-size: 0.95rem; color: #666; font-weight: 600;">Optional, but lets my dad reply back to you.</span>
              </div>
              
              <!-- Message Textarea -->
              <div class="form-group">
                <label for="sender-message">Your Message:</label>
                <textarea 
                  id="sender-message" 
                  name="message" 
                  class="form-control" 
                  required 
                  placeholder="What is your favorite build?"
                  maxlength="500"
                  aria-describedby="message-help"
                ></textarea>
                <span id="message-help" style="font-size: 0.95rem; color: #666; font-weight: 600;">Type or dictate your story here.</span>
              </div>
              
              <!-- Submit Button -->
              <div style="display: flex; justify-content: center; margin-top: 2rem;">
                <button type="submit" class="lego-btn yellow" id="btn-submit-message">
                  <span>🚀</span> Send Message!
                </button>
              </div>
              
            </fieldset>
          </form>
          
        </div>
      </div>
      
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/main.js"></script>
  <script>
    // Form submission helper for clean UX
    const form = document.getElementById('postbox-form');
    const submitBtn = document.getElementById('btn-submit-message');
    
    form.addEventListener('submit', () => {
      // Temporarily disable the button to prevent multiple submissions
      setTimeout(() => {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>⏳</span> Sending...';
      }, 0);
    });
  </script>
</body>
</html>
