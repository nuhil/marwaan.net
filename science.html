<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marwaan's STEM Lab | Science Experiments 🔬</title>
  <meta name="description" content="Check out my science and STEM experiments! Chemistry mixing, electrical battery wiring, and cool lab logs.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="canonical" href="https://marwaan.net/science.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>">
  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Marwaan's Lego World">
  <meta property="og:title" content="Marwaan's STEM Lab | Science Experiments 🔬">
  <meta property="og:description" content="Check out my science and STEM experiments! Chemistry mixing, electrical battery wiring, and cool lab logs.">
  <meta property="og:url" content="https://marwaan.net/science.html">
  <meta property="og:image" content="https://marwaan.net/images/headshot.JPG">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Marwaan's STEM Lab | Science Experiments 🔬">
  <meta name="twitter:description" content="Check out my science and STEM experiments! Chemistry mixing, electrical battery wiring, and cool lab logs.">
  <meta name="twitter:image" content="https://marwaan.net/images/headshot.JPG">
</head>
<body>
  
  <div id="site-header"></div>

  <main>
    <section class="lego-card green">
      <div class="lego-studs-row">
        <span class="lego-stud"></span>
        <span class="lego-stud"></span>
        <span class="lego-stud"></span>
        <span class="lego-stud"></span>
      </div>
      <div class="lego-card-body">
        <div style="display: flex; flex-direction: column; gap: 1.5rem; align-items: center; justify-content: space-between; text-align: center;">
          <div style="width: 100%;">
            <h1 style="margin-bottom: 0.75rem;">My STEM &amp; Science Experiments! 🔬</h1>
            <p style="font-size: 1.35rem; font-weight: 600; max-width: 800px; margin: 0 auto;">
              I love mixing ingredients in the kitchen lab, connecting electrical wires, and studying how things work. Here are my observation logs recorded with my dad!
            </p>
          </div>
          <button id="btn-add-experiment" class="lego-btn yellow" type="button" aria-label="Log a new experiment">
            <span>🧪</span> Add New Experiment
          </button>
        </div>
      </div>
    </section>

    <!-- STEM Logs grid list -->
    <div id="science-logs-grid" class="lego-grid-2">
      <!-- Injected programmatically by science.js -->
    </div>

    <!-- HTML5 Dialog Form for Recording New Experiment -->
    <dialog id="science-dialog" class="lightbox-dialog" style="max-width: 550px; padding: 2rem;" aria-label="Log new science experiment form">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: var(--border-width) solid var(--dark-gray); padding-bottom: 0.75rem; margin-bottom: 1.5rem; background-color: var(--sunny-yellow); padding: 1rem; border-radius: 12px; border: var(--border-width) solid var(--dark-gray); box-shadow: 3px 3px 0 var(--dark-gray);">
        <h2 style="font-family: var(--font-header); font-weight: 800; font-size: 1.6rem; color: var(--dark-gray); margin: 0;">Record Lab Experiment 🧪</h2>
        <button id="dialog-close" type="button" style="background: var(--white); border: 3px solid var(--dark-gray); width: 36px; height: 36px; border-radius: 50%; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center;" aria-label="Close form">❌</button>
      </div>
      <form id="science-form" method="dialog">
        <fieldset style="border: none;">
          <legend class="visually-hidden">Lab log entry inputs</legend>
          
          <div class="form-group">
            <label for="exp-title">Experiment Name:</label>
            <input type="text" id="exp-title" class="form-control" required placeholder="e.g. Baking Soda Volcano" maxlength="50">
          </div>
          
          <div class="form-group">
            <label for="exp-date">Date Conducted:</label>
            <input type="date" id="exp-date" class="form-control" required>
          </div>
          
          <div class="form-group">
            <label for="exp-category">Experiment Category:</label>
            <select id="exp-category" class="form-control" required style="appearance: auto; padding-right: 2rem;">
              <option value="Chemistry">Chemistry 🌋</option>
              <option value="Physics">Physics 💡</option>
              <option value="Engineering">Engineering ⚙️</option>
              <option value="Biology">Biology 🌿</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="exp-desc">Observations &amp; Notes:</label>
            <textarea id="exp-desc" class="form-control" required placeholder="Describe the materials, reactions, or results..." maxlength="300" style="min-height: 100px;"></textarea>
          </div>
          
          <div class="form-group">
            <label for="exp-rating">Fun Rating (1-5 Lego Studs):</label>
            <input type="range" id="exp-rating" class="form-control" min="1" max="5" value="5" step="1" style="height: 38px;">
          </div>
          
          <div style="display: flex; justify-content: center; margin-top: 2rem;">
            <button type="submit" class="lego-btn yellow" id="btn-save-exp">
              <span>💾</span> Save Lab Notes
            </button>
          </div>
        </fieldset>
      </form>
    </dialog>
  </main>

  <div id="site-footer"></div>

  <script src="js/main.js"></script>
  <script src="js/science.js"></script>
</body>
</html>
